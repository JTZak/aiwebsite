<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Magnolia">
  <defs>
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Browser frame -->
  <rect x="58" y="50" width="140" height="150" rx="20"
        fill="none" stroke="url(#mg)" stroke-width="9" stroke-linejoin="round"/>

  <!-- Window controls -->
  <g fill="url(#mg)">
    <circle cx="80" cy="76" r="4"/>
    <circle cx="94" cy="76" r="4"/>
    <circle cx="108" cy="76" r="4"/>
  </g>

  <!-- M-shaped petals extending out of the browser window -->
  <g fill="url(#mg)">
    <path d="M 128 232
             C 96 218, 58 184, 58 140
             C 58 108, 84 86, 108 102
             C 122 114, 128 170, 128 232 Z"/>
    <path d="M 128 232
             C 160 218, 198 184, 198 140
             C 198 108, 172 86, 148 102
             C 134 114, 128 170, 128 232 Z"/>
  </g>
</svg>
